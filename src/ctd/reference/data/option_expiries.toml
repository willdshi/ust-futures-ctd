# Expiries of standard (quarterly and serial) options on ZN, TN, ZB and UB futures.
#
# Generated from the CBOT rule in ctd.reference.options (rule_expiry) on the cme holiday list;
# tests/test_options.py fails if a record and the rule disagree. Expiry dates were checked against
# the last trade dates CME prints on page 1 of Section 42 (bulletin of 2026-10-21); DEC26 also by
# hand on CME's calendar. Add the next expiries the same way before they're needed.
#
# label: option month as the bulletin prints it. expiry: last trading day. underlying: the
# futures contract (a serial option is on the next quarterly futures). Weeklies aren't recorded.

[[expiry]]
product = "ZN"
label = "NOV26"
expiry = 2026-10-23
underlying = "ZNZ6"
quarterly = false
verified = ["expiry"]

