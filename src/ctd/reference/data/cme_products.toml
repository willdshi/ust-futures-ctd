# CME products collected every business day (design section 3.2): six Treasury
# futures and their options, plus SOFR and fed funds futures.
#
# product_id is CME's internal id used by its settlement web services
# (cmegroup.com/CmeWS/mvc/Settlements/...). verified = true means a settlement
# file fetched with that id was checked to be the named product (2026-10-16).
# A product with no product_id is reported as a failed fetch (and falls back
# to the manual-drop folder) rather than skipped.
#
# clearing_code is CME's clearing code for the contract, the PFCode column in its
# TCF conversion factor files (cme_tcf). Matched to each contract from the
# remaining maturities of its deliverables in TCF_20261019.csv.
#
# cf_round_months is how the conversion factor formula rounds remaining term down
# (ctd.bonds.conversion): whole months for ZT and ZF, quarters for the others.
# Checked against every stored TCF file, December 2023 to October 2026.
#
# Option series are not listed here: for each Treasury future, the collector
# reads CME's list of option expiries (quarterly, serial and every weekly
# series) and pulls all of them.

[[treasury]]
code = "ZT"
clearing_code = "26"
cf_round_months = 1
name = "2-Year T-Note"
product_id = 303
verified = true

[[treasury]]
code = "ZF"
clearing_code = "25"
cf_round_months = 1
name = "5-Year T-Note"
product_id = 329
verified = true

[[treasury]]
code = "ZN"
clearing_code = "21"
cf_round_months = 3
name = "10-Year T-Note"
product_id = 316
verified = true

[[treasury]]
code = "TN"
clearing_code = "TN"
cf_round_months = 3
name = "Ultra 10-Year T-Note"
product_id = 7978
verified = true

[[treasury]]
code = "ZB"
clearing_code = "17"
cf_round_months = 3
name = "U.S. Treasury Bond"
product_id = 307
verified = true

[[treasury]]
code = "UB"
clearing_code = "UBE"
cf_round_months = 3
name = "Ultra U.S. Treasury Bond"
product_id = 3141
verified = true

[[stir]]
code = "SR1"
name = "One-Month SOFR"
product_id = 8463
verified = true

[[stir]]
code = "SR3"
name = "Three-Month SOFR"
product_id = 8462
verified = true

[[stir]]
code = "ZQ"
name = "30-Day Federal Funds"
product_id = 305
verified = true

# Daily Bulletin sections saved by the browser bookmarklet (`ctd bookmarklet`).
# CME replaces each file with every new bulletin. When the bookmarklet runs on
# the Daily Bulletin page it uses the link there whose URL contains link_match;
# elsewhere it falls back to url (unverified).
[[bulletin]]
source = "cme_bulletin"
name = "Section42"
link_match = "Section42"
url = "https://www.cmegroup.com/daily_bulletin/current/Section42_10YrNote_5yrNote_2yrNote_30YrBond_Options.pdf"
