[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ust-futures-ctd"
version = "0.1.0"
description = "End-of-day CTD probabilities, futures DV01s and key rate durations for CBOT Treasury futures"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "requests",
    "openpyxl",
    "matplotlib",
    "pdfplumber",
    "databento",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "QuantLib"]

[project.scripts]
ctd = "ctd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ctd.reference" = ["data/*"]
"ctd.data" = ["*.js"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "slow: long-running tests (backtests, full grids)",
    "network: tests that hit external data sources",
]
xfail_strict = true

[tool.pyright]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "data"]